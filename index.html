<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Weiterleitung…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <h1>Switch to IOMeter app</h1>

  <p>
    <a id="iometer-link" href="https://auth.stage.iometer.cloud/oauth/authorize">
      Click here
    </a>
  </p>

  <script>
    // Hole alle Query-Parameter der aktuellen URL
    const queryString = window.location.search;

    // Füge sie an den Link an, wenn welche existieren
    const link = document.getElementById('iometer-link');
    if (queryString) {
      link.href += queryString;
    }
  </script>
</body>
</html>
